# cloudbase-init.conf — main (first boot / OOBE pass) config.
#
# mayfly attaches a NoCloud "cidata" ISO (volume label = cidata) with
# user-data + meta-data at the CD root (see go-proxmox makeCloudInitISO:
# volumeIdentifier = "cidata"). NoCloudConfigDriveService reads that CD.
#
# The Windows user-data is a #ps1_sysnative PowerShell script, so the
# userdata + localscripts plugins must be enabled to execute it.

[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=true
first_logon_behaviour=no

config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN

logging_serial_port_settings=

mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

# Only use the NoCloud config-drive datasource (the cidata CD mayfly attaches).
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService

# NoCloud config-drive: search the CDROM for a volume labelled "cidata".
# `types` are filesystem types (iso/vfat) — NOT locations; putting "cdrom"
# here makes newer Cloudbase-Init reject the whole set and find no metadata.
config_drive_types=iso,vfat
config_drive_locations=cdrom

plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.windows.ntpclient.NTPClientPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin

allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
