# cloudbase-init-unattend.conf — config used during the sysprep specialize
# pass (referenced by Cloudbase-Init's Unattend.xml). This runs once, early,
# on the very first boot of each clone before the main service pass. It sets
# hostname / extends the volume and runs user-data, but does NOT manage the
# Administrator password here (that is left to the main pass so the runner
# provisioning script controls the account).

[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=false
first_logon_behaviour=no

config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init-unattend.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN

logging_serial_port_settings=

mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
# `types` = filesystem types (iso/vfat) only; "cdrom" belongs in locations.
config_drive_types=iso,vfat
config_drive_locations=cdrom

plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin

allow_reboot=false
stop_service_on_exit=false
check_latest_version=false
